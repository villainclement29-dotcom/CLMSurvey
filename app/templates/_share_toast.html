<div id="share-toast" class="share-toast" hidden></div>

<script>
  (function () {
    // Délégation sur document, liée une seule fois pour toute la session
    // (persiste à travers les navigations Turbo, qui ne remplacent que le
    // <body> : réexécuter ce script à chaque page empilerait un nouveau
    // listener à chaque fois). L'élément #toast est donc recherché à
    // chaque déclenchement plutôt que capturé une fois, puisque Turbo le
    // recrée à chaque page.
    if (window.__shareToastBound) return;
    window.__shareToastBound = true;

    var toastTimer = null;

    function showToast(text) {
      var toast = document.getElementById("share-toast");
      if (!toast) return;
      toast.textContent = text;
      toast.hidden = false;
      requestAnimationFrame(function () { toast.classList.add("visible"); });
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove("visible");
        setTimeout(function () { toast.hidden = true; }, 250);
      }, 2000);
    }

    document.addEventListener("click", function (e) {
      var btn = e.target.closest(".share-btn");
      if (!btn) return;
      var url = window.location.origin + btn.dataset.shareUrl;
      var title = btn.dataset.shareTitle || document.title;
      if (navigator.share) {
        navigator.share({ title: title, url: url }).catch(function () {});
        return;
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url)
          .then(function () { showToast("Lien copié dans le presse-papiers"); })
          .catch(function () { showToast(url); });
      }
    });
  })();
</script>
