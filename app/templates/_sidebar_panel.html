{% import "_icons.html" as icons %}
<div class="sidebar-backdrop" id="sidebar-backdrop" hidden>
  <nav class="sidebar">
    <button type="button" class="sidebar-close" id="sidebar-close-btn" aria-label="Fermer le menu">&times;</button>

    <div class="sidebar-section">
      <a href="/" class="sidebar-link {{ 'active' if request.url.path == '/' else '' }}">{{ icons.home() }} Accueil</a>
      <a href="/calendar" class="sidebar-link {{ 'active' if request.url.path == '/calendar' else '' }}">{{ icons.calendar() }} Calendrier</a>
      <a href="/archives" class="sidebar-link {{ 'active' if request.url.path == '/archives' else '' }}">{{ icons.archive() }} Archives</a>
      <a href="/favorites" class="sidebar-link {{ 'active' if '/favorites' in request.url.path else '' }}">{{ icons.heart() }} Favoris</a>
    </div>
  </nav>
</div>

<div id="share-toast" class="share-toast" hidden></div>

<script>
  (function () {
    var toggleBtn = document.getElementById("menu-toggle-btn");
    var closeBtn = document.getElementById("sidebar-close-btn");
    var backdrop = document.getElementById("sidebar-backdrop");
    function openMenu() { backdrop.hidden = false; }
    function closeMenu() { backdrop.hidden = true; }
    toggleBtn.addEventListener("click", openMenu);
    closeBtn.addEventListener("click", closeMenu);
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeMenu(); });
  })();

  (function () {
    // Délégation sur document (pas de binding direct sur les boutons) :
    // fonctionne aussi pour les cartes chargées après coup, par ex. via
    // le scroll infini des archives.
    var toast = document.getElementById("share-toast");
    var toastTimer = null;

    function showToast(text) {
      toast.textContent = text;
      toast.hidden = false;
      requestAnimationFrame(function () { toast.classList.add("visible"); });
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove("visible");
        setTimeout(function () { toast.hidden = true; }, 250);
      }, 2000);
    }

    document.addEventListener("click", function (e) {
      var btn = e.target.closest(".share-btn");
      if (!btn) return;
      var url = window.location.origin + btn.dataset.shareUrl;
      var title = btn.dataset.shareTitle || document.title;
      if (navigator.share) {
        navigator.share({ title: title, url: url }).catch(function () {});
        return;
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url)
          .then(function () { showToast("Lien copié dans le presse-papiers"); })
          .catch(function () { showToast(url); });
      }
    });
  })();
</script>
