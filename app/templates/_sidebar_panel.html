{% import "_icons.html" as icons %}
<div class="sidebar-backdrop" id="sidebar-backdrop" hidden>
  <nav class="sidebar">
    <button type="button" class="sidebar-close" id="sidebar-close-btn" aria-label="Fermer le menu">&times;</button>

    <div class="sidebar-section">
      <a href="/" class="sidebar-link {{ 'active' if request.url.path == '/' else '' }}">{{ icons.home() }} Accueil</a>
      <a href="/calendar" class="sidebar-link {{ 'active' if request.url.path == '/calendar' else '' }}">{{ icons.calendar() }} Calendrier</a>
      <a href="/archives" class="sidebar-link {{ 'active' if request.url.path == '/archives' else '' }}">{{ icons.archive() }} Archives</a>
      <a href="/favorites" class="sidebar-link {{ 'active' if '/favorites' in request.url.path else '' }}">{{ icons.heart() }} Favoris</a>
    </div>
  </nav>
</div>

<script>
  (function () {
    var toggleBtn = document.getElementById("menu-toggle-btn");
    var closeBtn = document.getElementById("sidebar-close-btn");
    var backdrop = document.getElementById("sidebar-backdrop");
    function openMenu() { backdrop.hidden = false; }
    function closeMenu() { backdrop.hidden = true; }
    toggleBtn.addEventListener("click", openMenu);
    closeBtn.addEventListener("click", closeMenu);
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeMenu(); });
  })();
</script>
