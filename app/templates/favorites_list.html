<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — Veille scientifique</title>
  <link rel="stylesheet" href="/static/style.css?v={{ ASSET_VERSION }}">
  {% include "_pwa_head.html" %}
</head>
<body>
  <header>
    <div class="header-left">
      {% include "_sidebar_toggle.html" %}
      <h1>📁 {{ title }}</h1>
    </div>
  </header>

  {% set next_url = next %}
  {% if items %}
  <ul class="items">
    {% for item in items %}
    {% include "_item_card.html" %}
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty">Aucun article ici pour l'instant.</p>
  {% endif %}
  {% include "_sidebar_panel.html" %}
</body>
</html>
