<style>
  /* Couleurs et règles autonomes : ce splash doit pouvoir s'afficher dès
     que le HTML est parsé, sans attendre le téléchargement de
     style.css, sinon on retombe sur un écran vide pendant le chargement
     au lieu de l'animation. */
  #intro-splash {
    --intro-bg: #0f1115;
    --intro-border: #2a2e37;
    --intro-muted: #9aa2af;
    --intro-espace: #60a5fa;
    --intro-physique: #34d399;
    --intro-ia: #a78bfa;
    --intro-astronomie: #fbbf24;
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    background: var(--intro-bg);
    transition: opacity 0.7s ease;
  }

  @media (prefers-color-scheme: light) {
    #intro-splash {
      --intro-bg: #f6f7f9;
      --intro-border: #e2e5ea;
      --intro-muted: #5b6270;
      --intro-espace: #2563eb;
      --intro-physique: #059669;
      --intro-ia: #7c3aed;
      --intro-astronomie: #b45309;
    }
  }

  html.intro-seen #intro-splash { display: none; }

  #intro-splash.intro-hidden { opacity: 0; pointer-events: none; }

  #intro-splash svg { width: clamp(180px, 55vw, 260px); height: auto; }

  #intro-splash .intro-scene {
    transform: scaleY(0.5);
    transform-origin: 200px 200px;
  }

  #intro-splash .intro-orbit { fill: none; stroke: var(--intro-border); stroke-width: 1; }

  #intro-splash .intro-sun { fill: #f5a623; }

  #intro-splash .intro-sun-glow { fill: #f5a623; opacity: 0.25; }

  #intro-splash .intro-planet-orbit { transform-origin: 200px 200px; }

  #intro-splash .intro-label {
    font-family: "Times New Roman", Times, Georgia, serif;
    color: var(--intro-muted);
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: no-preference) {
    #intro-splash .intro-planet-orbit {
      animation-name: intro-orbit;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
  }

  @keyframes intro-orbit { to { transform: rotate(360deg); } }
</style>
<div id="intro-splash">
  <svg viewBox="0 0 400 400" role="presentation" aria-hidden="true">
    <g class="intro-scene">
      <circle class="intro-orbit" cx="200" cy="200" r="50"></circle>
      <circle class="intro-orbit" cx="200" cy="200" r="85"></circle>
      <circle class="intro-orbit" cx="200" cy="200" r="120"></circle>
      <circle class="intro-orbit" cx="200" cy="200" r="155"></circle>

      <g class="intro-planet-orbit" style="animation-duration: 3s;">
        <circle class="intro-planet" cx="250" cy="200" r="5" style="fill: var(--intro-espace);"></circle>
      </g>
      <g class="intro-planet-orbit" style="animation-duration: 5s;">
        <circle class="intro-planet" cx="285" cy="200" r="6" style="fill: var(--intro-physique);"></circle>
      </g>
      <g class="intro-planet-orbit" style="animation-duration: 7.5s;">
        <circle class="intro-planet" cx="320" cy="200" r="5" style="fill: var(--intro-ia);"></circle>
      </g>
      <g class="intro-planet-orbit" style="animation-duration: 10.5s;">
        <circle class="intro-planet" cx="355" cy="200" r="7" style="fill: var(--intro-astronomie);"></circle>
      </g>
    </g>

    <circle class="intro-sun-glow" cx="200" cy="200" r="26"></circle>
    <circle class="intro-sun" cx="200" cy="200" r="18"></circle>
  </svg>
  <p class="intro-label">Veille scientifique</p>
</div>
<script>
  (function () {
    var splash = document.getElementById("intro-splash");
    if (!splash) return;
    if (sessionStorage.getItem("introShown")) {
      splash.remove();
      return;
    }
    sessionStorage.setItem("introShown", "1");
    // Le splash reste tant que la page n'a pas fini de charger (evite un
    // écran vide pendant le chargement), avec un minimum visible pour ne
    // pas juste flasher si tout charge très vite.
    var minDelay = new Promise(function (resolve) { setTimeout(resolve, 1200); });
    var pageLoaded = document.readyState === "complete"
      ? Promise.resolve()
      : new Promise(function (resolve) { window.addEventListener("load", resolve); });
    Promise.all([minDelay, pageLoaded]).then(function () {
      splash.classList.add("intro-hidden");
      setTimeout(function () { splash.remove(); }, 700);
    });
  })();
</script>
