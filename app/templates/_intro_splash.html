<style>
  /* Couleurs et règles autonomes : ce splash doit pouvoir s'afficher dès
     que le HTML est parsé, sans attendre le téléchargement de
     style.css, sinon on retombe sur un écran vide pendant le chargement
     au lieu de l'animation. */
  #intro-splash {
    --intro-bg: #0f1115;
    --intro-border: #2a2e37;
    --intro-muted: #9aa2af;
    position: fixed;
    inset: 0;
    z-index: 999;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    background: var(--intro-bg);
    transition: opacity 0.7s ease;
  }

  @media (prefers-color-scheme: light) {
    #intro-splash {
      --intro-bg: #f6f7f9;
      --intro-border: #e2e5ea;
      --intro-muted: #5b6270;
    }
  }

  html.intro-seen #intro-splash { display: none; }

  #intro-splash.intro-hidden { opacity: 0; pointer-events: none; }

  #intro-splash .intro-stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  #intro-splash .intro-stars circle { fill: var(--intro-muted); }

  #intro-splash .intro-solar-system {
    position: relative;
    z-index: 1;
    width: clamp(180px, 55vw, 260px);
    height: auto;
  }

  #intro-splash .intro-scene {
    transform: scaleY(0.5);
    transform-origin: 200px 200px;
  }

  #intro-splash .intro-orbit { fill: none; stroke: var(--intro-border); stroke-width: 1; }

  #intro-splash .intro-sun { fill: #f5a623; }

  #intro-splash .intro-sun-glow { fill: #f5a623; opacity: 0.25; }

  @media (prefers-reduced-motion: no-preference) {
    #intro-splash .intro-planet {
      animation-name: intro-orbit-motion;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
  }

  @keyframes intro-orbit-motion { to { offset-distance: 100%; } }

  #intro-splash .intro-label {
    position: relative;
    z-index: 1;
    font-family: "Times New Roman", Times, Georgia, serif;
    color: var(--intro-muted);
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>

<script>
  (function () {
    var splash = document.getElementById("intro-splash");
    if (!splash) return;
    if (sessionStorage.getItem("introShown")) {
      splash.remove();
      return;
    }
    sessionStorage.setItem("introShown", "1");
    // Le splash reste tant que la page n'a pas fini de charger (evite un
    // écran vide pendant le chargement), avec un minimum de 3s pour que
    // l'animation ait le temps de se jouer même si tout charge très vite.
    var minDelay = new Promise(function (resolve) { setTimeout(resolve, 3000); });
    var pageLoaded = document.readyState === "complete"
      ? Promise.resolve()
      : new Promise(function (resolve) { window.addEventListener("load", resolve); });
    Promise.all([minDelay, pageLoaded]).then(function () {
      splash.classList.add("intro-hidden");
      setTimeout(function () { splash.remove(); }, 700);
    });
  })();
</script>
